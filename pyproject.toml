[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "python-onelap"
version = "0.1.0"
description = "Unofficial client for downloading rides (FIT files) from OneLap / Magene"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.urls]
Homepage = "https://github.com/Michal-Ser/python-onelap"

[tool.setuptools]
packages = ["onelap"]
